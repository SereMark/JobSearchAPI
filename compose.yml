services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: job_search
      POSTGRES_USER: job_search
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - job_search_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_search -d job_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job_search_postgres_data:
