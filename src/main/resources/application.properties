spring.application.name=job-search-api

server.address=${JOB_SEARCH_SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${JOB_SEARCH_DB_URL:jdbc:postgresql://127.0.0.1:5432/job_search}
spring.datasource.username=${JOB_SEARCH_DB_USERNAME:job_search}
spring.datasource.password=${JOB_SEARCH_DB_PASSWORD:local_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
